<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Mahmoud Selmi</title>
    <link rel="icon" type="image/svg+xml" href="/MahmoudSelmi_Portfolio/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #070c18;
        color: #ffffff;
        font-family: "IBM Plex Mono", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 2rem;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid #263352;
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        padding: 0.6rem 1rem;
        background: #0f1626;
      }
      .dot { width: 10px; height: 10px; border-radius: 999px; }
      .body {
        border: 1px solid #263352;
        border-radius: 0 0 12px 12px;
        background: #0a1120;
        padding: 2rem 1.5rem;
      }
      .code { color: #2f7bff; font-size: 2.5rem; font-weight: 600; }
      .msg { color: #93a1c2; margin-top: 0.75rem; font-size: 0.9rem; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #ff8a3d;
        text-decoration: none;
        border: 1px solid #263352;
        border-radius: 999px;
        padding: 0.6rem 1.4rem;
        font-size: 0.85rem;
        transition: border-color 0.2s ease;
      }
      a:hover { border-color: #ff8a3d; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="chrome">
        <span class="dot" style="background:#ff5f56"></span>
        <span class="dot" style="background:#ffbd2e"></span>
        <span class="dot" style="background:#27c93f"></span>
      </div>
      <div class="body">
        <div class="code">404</div>
        <p class="msg">bash: route not found<br />This page doesn't exist.</p>
        <a href="/MahmoudSelmi_Portfolio/">← Back to portfolio</a>
      </div>
    </div>
  </body>
</html>
